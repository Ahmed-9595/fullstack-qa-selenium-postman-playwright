name: Electro Pi QA Automation Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # 1️⃣ المرحلة الأولى: اختبارات الـ API عبر Postman (Newman)
  api-tests:
    name: Run Postman API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Postman Collection
        run: |
          npm install -g newman
          newman run postman/ElectroPi_Inventory_API.postman_collection.json \
            -e postman/ElectroPi_Staging.postman_environment.json

  # 2️⃣ المرحلة الثانية: اختبارات الـ UI عبر Selenium (Java 25)
  selenium-ui-tests:
    name: Run Selenium Test Suite (Java 25)
    runs-on: ubuntu-latest
    needs: api-tests # بتشتغل بعد نجاح الـ API

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle'
          java-version: '25'
          cache: 'maven'

      - name: Run Selenium Tests via Maven
        run: |
          cd selenium-suite
          mvn clean test \
            -Dbase.url="${{ secrets.BASE_URL }}" \
            -Dadmin.username="${{ secrets.STORE_ADMIN_EMAIL }}" \
            -Dadmin.password="${{ secrets.STORE_ADMIN_PASSWORD }}" \
            -Dheadless=true

      - name: Upload Surefire Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-test-reports
          path: selenium-suite/target/surefire-reports/